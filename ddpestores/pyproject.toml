[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "ddpestores"
version = "0.1"
authors = [
  { name="thierry_otvl", email="tbeigbeder.nospam@gmail.com" },
]
description = "This is ddpestores"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "LicenseRef-EUPL-1.2-or-later"
license-files = ["LICENSE.md"]
dependencies = [
  "ddpbasics @ /tools/pip_repo/ddpbasics/ddpbasics-0.1-py3-none-any.whl",
  "cryptography>=46.0.3,<47",
  "PyYAML>=6.0.3,<7",
  "boto3>=1.42,<2",
  "psycopg[binary]>=3.3,<3.4",
  "grpcio>=1.76,<1.77",
  "grpcio-tools>=1.76,<1.77",
]

[project.urls]
Homepage = "https://github.com/t-beigbeder/ddptools"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest]
log_cli = false
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s %(name)s %(levelname)-8s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

[[tool.mypy.overrides]]
module = ["xdg.*"]
follow_untyped_imports = true

[tool.coverage.run]
omit = [
    "*_pb2.py",
    "*_pb2_grpc.py"
    ]